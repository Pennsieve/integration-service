services:
  base-pennsievedb:
    image: pennsieve/pennsievedb:V20241120161735-seed
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  integration-migrations:
    image: pennsieve/integration-service-dbmigrate:latest
    build:
      context: .
      dockerfile: Dockerfile.cloudwrap-dbmigrate
    entrypoint: ["/app/integration-service-dbmigrate"]
    environment:
      POSTGRES_HOST: base-pennsievedb
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: postgres
    depends_on:
      base-pennsievedb:
        condition: service_healthy
