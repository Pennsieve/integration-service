#file: noinspection MaybeTerraformTemplateInspection
# NOTE: like terraform/integration-service.yml, this spec is documentation
# rather than a build input — the notifications API Gateway in
# notification_gateway.tf is wired up via individual aws_apigatewayv2_*
# resources, not an imported OpenAPI body, and there is no
# .github/workflows/rdme-openapi.yml in this repo yet. It exists so that
# if/when integration-service adopts the org-standard OpenAPI-driven gateway
# + ReadMe publishing pattern, the notification/subscription API is already
# documented.
#
# Paths below are as served on the API domain. The notifications gateway is
# mapped under the "notification" API mapping key, so its routes are declared
# in Terraform without the /notification prefix (e.g. "GET /topics").
#
# Naming: plural paths name a collection (/topics, /subscriptions,
# /messages); singular paths name one resource (/subscription/{id},
# /user/{id}, /topic/{id}/subscription).
#
# Auth assumption: unlike /webhook (shared-secret, internal-only), these
# endpoints are user-facing and sit behind the shared Pennsieve Lambda REQUEST
# authorizer (see aws_apigatewayv2_authorizer.pennsieve_lambda_authorizer in
# notification_gateway.tf), which resolves the caller's bearer token to a Pennsieve user
# and surfaces it as the "user_claim" context key consumed by the Lambda
# handler.
openapi: 3.0.1
info:
  version: "2.0"
  title: Integration Service - Notifications
  description: |
    User subscription and notification retrieval API for the Integration
    Service's email/notification system. Subscriptions are never deleted:
    users enable or disable them, so the notifications already delivered to
    a subscription (in-app and email) stay in the user's history.
  termsOfService: https://docs.pennsieve.io/page/pennsieve-terms-of-use
  contact:
    name: Pennsieve Support
    email: support@pennsieve.net
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://api2.pennsieve.io
    description: Production server
  - url: https://api2.pennsieve.net
    description: Development server
externalDocs:
  description: Find more info here
  url: https://docs.pennsieve.io
tags:
  - name: Notifications
    description: Topics, subscriptions, and notifications

components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Caller may not act on another user's record
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error:
      description: Unexpected error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  parameters:
    topicId:
      name: topicId
      in: path
      required: true
      description: Numeric id of the topic
      schema: { type: integer, format: int64 }
    userId:
      name: userId
      in: path
      required: true
      description: >-
        Numeric Pennsieve id of the user. Must be the caller's own id; any
        other value is rejected with 403.
      schema: { type: integer, format: int64 }
    subscriptionId:
      name: subscriptionId
      in: path
      required: true
      description: Numeric id of the subscription
      schema: { type: integer, format: int64 }
    limit:
      name: limit
      in: query
      required: false
      description: >-
        Maximum number of notifications to return. A missing or out-of-range
        value falls back to the default.
      schema: { type: integer, format: int32, default: 50, minimum: 1, maximum: 200 }
    offset:
      name: offset
      in: query
      required: false
      description: Number of notifications to skip, for pagination
      schema: { type: integer, format: int32, default: 0, minimum: 0 }
  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
      required: [code, message]
    Topic:
      type: object
      properties:
        topic_id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
          description: >-
            Whether the topic accepts new subscriptions. Disabled topics are
            still listed so existing subscriptions and history under them can
            be displayed.
        context:
          type: object
          nullable: true
          description: JSON Schema that a subscription's context must satisfy.
        created_at:
          type: string
          format: date-time
      required: [topic_id, name, enabled, created_at]
    Subscription:
      type: object
      properties:
        subscription_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        topic_id:
          type: integer
          format: int64
        context:
          type: object
          description: Free-form JSON context for the subscription (e.g. filters).
          nullable: true
        enabled:
          type: boolean
          description: >-
            Whether new notifications are delivered to this subscription.
            Disabling it keeps the subscription and its notification history.
        created_at:
          type: string
          format: date-time
      required: [subscription_id, user_id, topic_id, enabled, created_at]
    UpdateSubscriptionRequest:
      type: object
      properties:
        enabled:
          type: boolean
          description: Turn the subscription on (true) or off (false). Required and non-null.
      required: [enabled]
    SubscribeRequest:
      type: object
      description: >-
        Free-form JSON object stored as the subscription's context. It must
        satisfy the JSON Schema in the topic's context (see GET
        /notification/topics), and when it carries organizationId and
        datasetId, that dataset must exist in that organization.
      additionalProperties: true
      example:
        organizationId: 1
        datasetId: 42
    NotificationPreferences:
      type: object
      description: >-
        A user's full notification preferences: their email/push channel
        opt-ins plus notificationsLastSeen, the read side of the field
        exposed on the Pennsieve API's GET /user. All stored on
        notifications.preferences.
      properties:
        userId:
          type: integer
          format: int64
        emailEnabled:
          type: boolean
        pushEnabled:
          type: boolean
        notificationsLastSeen:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 UTC timestamp, or null if the user has never viewed notifications.
      required: [userId, emailEnabled, pushEnabled, notificationsLastSeen]
    SetNotificationPreferencesRequest:
      type: object
      description: >-
        Fully replaces the user's stored email/push preferences. Both fields
        are required; this never changes notificationsLastSeen (see
        UpdateNotificationsLastSeenRequest for that).
      properties:
        emailEnabled:
          type: boolean
        pushEnabled:
          type: boolean
      required: [emailEnabled, pushEnabled]
    UserNotificationsLastSeen:
      type: object
      description: >-
        When a user last viewed their notifications. This is the write side of
        the notificationsLastSeen field exposed on the Pennsieve API's
        GET /user; the value is stored on notifications.preferences.
      properties:
        userId:
          type: integer
          format: int64
        notificationsLastSeen:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 UTC timestamp, or null if the user has never viewed notifications.
      required: [userId, notificationsLastSeen]
    UpdateNotificationsLastSeenRequest:
      type: object
      properties:
        notificationsLastSeen:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of the view. Required and non-null.
      required: [notificationsLastSeen]
    Notification:
      type: object
      properties:
        notification_id:
          type: integer
          format: int64
        subscription_id:
          type: integer
          format: int64
        topic_id:
          type: integer
          format: int64
          description: Topic of the subscription the notification was posted to.
        title:
          type: string
        message:
          type: string
        metadata:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
      required: [notification_id, subscription_id, topic_id, title, message, created_at]

paths:
  /notification/topics:
    get:
      summary: Get available topics
      description: >-
        Returns every topic, including disabled ones. Only enabled topics
        accept new subscriptions.
      operationId: getTopics
      tags: [Notifications]
      security:
        - bearer_auth: [ ]
      responses:
        '200':
          description: List of topics
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Topic' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '5XX':
          $ref: '#/components/responses/Error'

  /notification/subscriptions:
    get:
      summary: Get the caller's subscriptions
      description: >-
        Returns every subscription belonging to the authenticated user, both
        enabled and disabled.
      operationId: getUserSubscriptions
      tags: [Notifications]
      security:
        - bearer_auth: [ ]
      responses:
        '200':
          description: List of the caller's subscriptions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Subscription' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '5XX':
          $ref: '#/components/responses/Error'

  /notification/topic/{topicId}/subscription:
    post:
      summary: Subscribe to a topic
      description: |
        Subscribes the authenticated user to the given topic. The request
        body is the subscription's context and is validated before it is
        stored: it must be a JSON object matching the topic's context JSON
        Schema, and any dataset it references (organizationId + datasetId)
        must exist. An empty body is treated as {}. Calling this again with
        the same context returns that subscription rather than creating a
        duplicate, re-enabling it if the caller had disabled it.
      operationId: subscribeToTopic
      tags: [Notifications]
      security:
        - bearer_auth: [ ]
      parameters:
        - $ref: '#/components/parameters/topicId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscribeRequest' }
      responses:
        '201':
          description: New subscription created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '200':
          description: >-
            Caller was already subscribed to this topic with this context; the
            existing subscription is returned (and re-enabled if it was
            disabled) rather than creating a duplicate row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400':
          description: >-
            Invalid topicId, malformed base64 body, body is not a JSON object,
            body does not match the topic's context schema, or the referenced
            dataset does not exist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Topic does not exist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Topic is disabled and accepts no new subscriptions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '5XX':
          $ref: '#/components/responses/Error'

  /notification/subscription/{subscriptionId}:
    patch:
      summary: Enable or disable a subscription
      description: |
        Turns one of the caller's own subscriptions on or off. This replaces
        unsubscribing by deletion: a disabled subscription receives no new
        notifications, but the subscription and the notifications already
        posted to it are kept, so the user's in-app and email history is
        preserved and the subscription can be re-enabled later.

        A subscription that doesn't exist and one that belongs to another
        user both return 404, so the route can't be used to probe which
        subscription ids exist.
      operationId: updateSubscription
      tags: [Notifications]
      security:
        - bearer_auth: [ ]
      parameters:
        - $ref: '#/components/parameters/subscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSubscriptionRequest' }
      responses:
        '200':
          description: Subscription updated; returns the updated resource
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400':
          description: >-
            Invalid subscriptionId, malformed base64 body, body is not valid
            JSON, or enabled is missing, null, or not a boolean
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '5XX':
          $ref: '#/components/responses/Error'

  /notification/messages:
    get:
      summary: Retrieve the caller's notifications
      description: >-
        Returns every notification posted to any of the caller's
        subscriptions, newest first, including those posted to subscriptions
        the caller has since disabled.
      operationId: getMessages
      tags: [Notifications]
      security:
        - bearer_auth: [ ]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: List of the caller's notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '5XX':
          $ref: '#/components/responses/Error'

  /notification/user/{userId}:
    get:
      summary: Get the user's notification preferences
      description: >-
        Returns the caller's email/push notification opt-ins plus their
        notificationsLastSeen timestamp. The latter is provided so the value
        is readable from this service; user-facing clients normally read the
        same value from the notificationsLastSeen field on the Pennsieve
        API's GET /user.
      operationId: getNotificationPreferences
      tags: [Notifications]
      security:
        - bearer_auth: [ ]
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: >-
            The user's notification preferences. A user with no stored
            preferences yet reads back the same defaults a first write would
            get (email enabled, push disabled, never seen).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '400':
          description: Invalid userId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '5XX':
          $ref: '#/components/responses/Error'
    post:
      summary: Set the user's notification preferences
      description: |
        Fully replaces the user's stored email/push notification opt-ins. A
        caller may only update their own record: if {userId} is not the
        authenticated user's id the request is rejected with 403. This
        endpoint never changes notificationsLastSeen — use
        PATCH /notification/user/{userId} for that.

        The write is an upsert, so it succeeds for a user who has no
        notifications.preferences row yet (rows are otherwise seeded on first
        subscription).
      operationId: setNotificationPreferences
      tags: [Notifications]
      security:
        - bearer_auth: [ ]
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetNotificationPreferencesRequest' }
      responses:
        '200':
          description: Preferences persisted; returns the updated resource
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '400':
          description: >-
            Invalid userId, malformed base64 body, body is not valid JSON, or
            emailEnabled/pushEnabled is missing, null, or not a boolean
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User does not exist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '5XX':
          $ref: '#/components/responses/Error'
    patch:
      summary: Record that the user viewed their notifications
      description: |
        Partially updates just the user's notificationsLastSeen timestamp,
        leaving their email/push preferences untouched. A caller may only
        update their own record: if {userId} is not the authenticated user's
        id the request is rejected with 403.

        Split out from the POST preferences endpoint above because this is
        written far more often — once per notifications-UI open — than a
        user's channel preferences change.

        The write is an upsert, so it succeeds for a user who has no
        notifications.preferences row yet (rows are otherwise seeded on first
        subscription).
      operationId: updateNotificationsLastSeen
      tags: [Notifications]
      security:
        - bearer_auth: [ ]
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNotificationsLastSeenRequest' }
      responses:
        '200':
          description: Timestamp persisted; returns the updated value
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserNotificationsLastSeen' }
        '400':
          description: >-
            Invalid userId, malformed base64 body, body is not valid JSON, or
            notificationsLastSeen is missing, null, or not a timestamp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User does not exist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '5XX':
          $ref: '#/components/responses/Error'
